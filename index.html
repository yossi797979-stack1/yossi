<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>מחולל דפי קטלוג</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=Assistant:wght@300;400;600;700&family=Rubik:wght@400;500;700&family=Secular+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">מחולל דפי קטלוג <span>A4</span></div>
    <div class="tb-group pages-nav">
      <button id="prevPage" title="עמוד קודם">›</button>
      <span id="pageInfo">עמוד 1 מתוך 1</span>
      <button id="nextPage" title="עמוד הבא">‹</button>
      <button id="addPage">＋ עמוד</button>
      <button id="dupPage">⧉ שכפל</button>
      <button id="delPage">🗑 מחק</button>
    </div>
    <div class="tb-group">
      <button id="btnPreview">👁 תצוגה מקדימה</button>
      <button id="btnImport">📥 ייבוא מאקסל</button>
      <button id="btnExcel">📤 ייצוא לאקסל</button>
    </div>
    <div class="tb-group">
      <button id="btnOpen">פתח פרויקט</button>
      <button id="btnSave">שמור פרויקט</button>
      <button id="btnReset">טען דוגמה</button>
    </div>
    <div class="tb-group">
      <button id="btnExportJpg" class="primary">ייצוא JPG</button>
      <button id="btnExportPdf" class="primary">ייצוא PDF לדפוס</button>
    </div>
  </header>

  <main class="layout">
    <aside class="form-panel" id="formPanel"></aside>

    <section class="workspace" id="workspace">
      <div class="preview-wrap" id="previewWrap">
        <div class="preview-scale" id="previewScale"></div>
      </div>
      <div class="zoombar">
        <button id="zoomOut">−</button><span id="zoomLabel">100%</span><button id="zoomIn">+</button>
        <button id="zoomFit">התאם</button>
        <span class="zb-note">A4 · ייצוא לדפוס עד 600dpi, עם גלישה וסימני חיתוך</span>
      </div>
    </section>
  </main>

  <input type="file" id="fileInput" accept="image/*" hidden>
  <input type="file" id="projectInput" accept=".json,application/json" hidden>

  <div id="modalHost"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="busy" class="busy" hidden><div class="busy-box"><div class="spinner"></div><div id="busyText">מעבד…</div></div></div>
  <div id="exportHost" class="export-host" aria-hidden="true"></div>

  <script src="lib/JsBarcode.all.min.js"></script>
  <script src="lib/jspdf.umd.min.js"></script>
  <script src="lib/html2canvas-pro.min.js"></script>
  <script src="lib/xlsx.full.min.js"></script>
  <script src="lib/jszip.min.js"></script>
  <script src="lib/jpeg-cmyk.js"></script>
  <script src="lib/pdf-fonts.js"></script>
  <script src="samples.js"></script>
  <script src="app.js"></script>
</body>
</html>
